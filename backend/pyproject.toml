[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "passlib>=1.7.4",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "python-jose>=3.5.0",
    "redis>=5.0.8",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

