services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamhub_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres_db:5432/postgres_db
      - REDIS_URL=redis://redis_cache:6379/0
      - ENVIRONMENT=development
      - DEBUG=True
      - PORT=8000
      - HOST=0.0.0.0
      - API_V1_PREFIX=/task_management/api/v1
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=abhishekbganeshwadi@gmail.com
      - SMTP_PASSWORD=csxbilgmdnqxkgud
      - SMTP_FROM_EMAIL=abhishekbganeshwadi@gmail.com
      - EMAILS_FROM_NAME=Team Hub
      - FRONTEND_URL=http://localhost:3000
    networks:
      - localdb_default
    restart: unless-stopped

networks:
  localdb_default:
    external: true
